# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.0, 22.0, 24.0]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Report Node and NPM versions
      run: echo Using Node $(node --version) and NPM $(npm --version)

    # This project's .npmrc requires NPM 12.
    # We can't reliably install NPM 12 on anything before Node 26:
    # * NPM 12 won't run on any Node 20 version, or on older 22 and
    #   24 minors.
    # * npm install -g fails on cimg/node:24.* due to permissions.
    # Removing .npmrc theoretically leaves CI vulnerable to supply
    # chain attacks, but CI produces no artifacts and has no access
    # to credentials (except for the Saucelabs API key, and that's
    # only provided to trusted invocations.)
    - name: Remove .npmrc
      run: rm .npmrc

    - run: npm install
    - run: npm test
